<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SafeTrack AI - Дашборд</title>
    <style>
        /* Современный темный индустриальный дизайн */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 2rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .header { 
            width: 100%; 
            max-width: 1400px; 
            padding-bottom: 1rem; 
            border-bottom: 1px solid #334155; 
            margin-bottom: 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .header h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; font-weight: 600; letter-spacing: 0.5px;}
        .status-badge { 
            background: rgba(16, 185, 129, 0.2); 
            color: #10b981; 
            padding: 0.5rem 1rem; 
            border-radius: 9999px; 
            font-weight: 600; 
            font-size: 0.875rem; 
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        
        .dashboard { 
            display: flex; 
            gap: 2rem; 
            width: 100%; 
            max-width: 1400px; 
            flex-wrap: wrap; 
        }
        .video-panel { 
            flex: 3; 
            background: #1e293b; 
            padding: 1rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
            min-width: 600px; 
        }
        .video-panel img { width: 100%; border-radius: 0.5rem; display: block; }
        
        .log-panel { 
            flex: 1; 
            background: #1e293b; 
            padding: 1.5rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); 
            min-width: 300px; 
            display: flex; 
            flex-direction: column; 
        }
        .log-panel h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; color: #cbd5e1;}
        .log-messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            max-height: 700px; 
            display: flex; 
            flex-direction: column; 
            gap: 0.75rem; 
            padding-right: 0.5rem;
        }
        
        .alert-card { 
            background: rgba(239, 68, 68, 0.1); 
            border-left: 4px solid #ef4444; 
            padding: 1rem; 
            border-radius: 0.25rem 0.5rem 0.5rem 0.25rem; 
            animation: slideIn 0.3s ease-out;
        }
        .alert-time { font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .alert-text { color: #fecaca; font-weight: 500; font-size: 0.9rem;}
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="header">
        <h1>SafeTrack AI // Охрана Периметра</h1>
        <div class="status-badge">● Система активна</div>
    </div>

    <div class="dashboard">
        <div class="video-panel">
            <!-- Видео поток (MJPEG) -->
            <img src="/video_feed" alt="Live Camera Feed">
        </div>
        
        <div class="log-panel">
            <h2>Журнал нарушений</h2>
            <div class="log-messages" id="logs">
                <div style="color: #64748b; text-align: center; margin-top: 2rem;">Ожидание событий...</div>
            </div>
        </div>
    </div>

    <script>
        // Функция для опроса бэкенда каждую секунду
        async function fetchAlerts() {
            try {
                const response = await fetch('/alerts');
                const data = await response.json();
                const logsDiv = document.getElementById('logs');
                
                if (data.alerts.length === 0) return;
                
                // Очищаем текущие логи
                logsDiv.innerHTML = '';
                
                // Добавляем логи в обратном порядке (новые сверху)
                data.alerts.slice().reverse().forEach(alert => {
                    const card = document.createElement('div');
                    card.className = 'alert-card';
                    card.innerHTML = `
                        <div class="alert-time">${alert.time}</div>
                        <div class="alert-text">${alert.message}</div>
                    `;
                    logsDiv.appendChild(card);
                });
            } catch (error) {
                console.error("Ошибка получения логов:", error);
            }
        }

        // Запускаем опрос каждые 1000 мс (1 секунда)
        setInterval(fetchAlerts, 1000);
    </script>
</body>
</html>
